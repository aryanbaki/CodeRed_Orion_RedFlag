name: Framework checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:ui
      - run: npm run test:discovery-browser
      - run: npm run test:actions-browser
      - run: npm run test:site-discovery
      - run: npm run test:backend-browser
      - run: npm run test:popup-redesign
      - run: npm run test:dashboard
      - run: npm run test:branding
      - run: npm run test:integration
      - run: npm run test:vault
