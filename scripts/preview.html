<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RedFlag interactive simulator</title><script src="simulator-api.js"></script><style>
@font-face{font-family:"Merriweather";src:url("fonts/Merriweather-Regular.ttf") format("truetype");font-weight:400;font-display:swap}@font-face{font-family:"Merriweather";src:url("fonts/Merriweather-Bold.ttf") format("truetype");font-weight:700;font-display:swap}*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f4f5f7;font:14px/1.5 "Merriweather",Georgia,serif}header{padding:18px 24px;background:#24282e;border-bottom:2px solid #ff334f}h1{font-size:19px;margin:0}p{margin:6px 0;color:#b5bac3}.badge{color:#ffce85;font-weight:bold}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button,select{font:inherit;padding:8px 12px;color:#f4f5f7;background:#1b1e22;border:1px solid #626975;border-radius:6px;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #ffce85}main{display:flex;justify-content:center;gap:24px;padding:24px;align-items:start;flex-wrap:wrap}.popup-frame{width:482px;height:820px;border:1px solid #626975;border-radius:10px;background:#121416;overflow:hidden}#dashboard-section{width:min(900px,100%)}.dashboard-frame{width:100%;height:700px;border:1px solid #626975;border-radius:10px}iframe{width:100%;height:100%;border:0}.caption{margin-bottom:8px;font-size:12px}#notice{min-height:20px;color:#ffce85}.dashboard-frame[hidden]{display:none}
</style></head><body><header><h1><span class="badge">SIMULATOR</span> · RedFlag · Merriweather preview</h1><p>Merriweather layout preview. Sample policies and grades; no live Gemini calls.</p><div class="controls"><label>Scenario <select id="scenario"><option value="partial">Partial review</option><option value="rated" selected>Rated documents</option><option value="pending">Analyzing</option><option value="inaccessible">Inaccessible / Unrated</option></select></label><button id="popup">Popup</button><button id="dashboard">My Sites</button><button id="settings">Dashboard settings</button><button id="reset">Reset demo</button></div><p id="notice" role="status">Try Analyze all, Summary, Red flags, Chat, and Device vault.</p></header><main><section><p class="caption">Actual built popup · Merriweather · scroll to explore</p><div class="popup-frame"><iframe id="popup-frame" title="Simulated RedFlag popup" src="popup.html"></iframe></div></section><section id="dashboard-section" hidden><p class="caption">Actual built dashboard · synthetic locally saved review</p><div class="dashboard-frame"><iframe id="dashboard-frame" title="Simulated RedFlag dashboard" src="dashboard.html"></iframe></div></section></main><script>
const dash=document.querySelector('#dashboard-section'),frame=document.querySelector('#dashboard-frame');function showDashboard(url='dashboard.html'){dash.hidden=false;frame.src=url;dash.scrollIntoView({behavior:'smooth'});}
document.querySelector('#scenario').onchange=e=>simulator.scenario(e.target.value);document.querySelector('#reset').onclick=()=>{simulator.reset();document.querySelector('#scenario').value='rated';document.querySelector('#popup-frame').src='popup.html';};document.querySelector('#popup').onclick=()=>{dash.hidden=true;document.querySelector('#popup-frame').src='popup.html';};document.querySelector('#dashboard').onclick=()=>showDashboard();document.querySelector('#settings').onclick=()=>showDashboard('dashboard.html#settings');window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data.simulatorNavigate){const url=new URL(e.data.simulatorNavigate);if(url.origin===location.origin&&url.pathname.endsWith('/dashboard.html'))showDashboard(url.href);}if(e.data.simulatorNotice)document.querySelector('#notice').textContent=e.data.simulatorNotice;});
</script></body></html>
