<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RedFlag</title><link rel="stylesheet" href="popup.css"></head>
<body><main>
<header class="brand"><img class="brand-logo" src="icons/redflag-128.png" alt="" width="40" height="40"><div><h1>RedFlag</h1><p id="domain">Current website</p></div><button id="settings-link" class="secondary icon-button" aria-label="Settings">⚙</button></header>
<section id="onboarding" hidden><h2>Enable policy checks</h2><p>Gemini reads public policies. ToS;DR receives the site domain. Your account data and form inputs stay out.</p><p id="connection-status" class="note" role="status">Connecting…</p><button id="start">Enable checks</button><button id="community-only" class="secondary">Not now</button><button id="retry-connection" class="secondary">Retry connection</button><details><summary>Advanced connection</summary><button id="connect">Import connection file</button><input id="connection-file" type="file" accept="application/json,.json" hidden></details></section>
<section aria-label="Current site"><h2 id="current-heading" class="sr-only">Site review</h2><p id="status" role="status" aria-live="polite"></p><div id="loading" hidden role="status">Looking for policies…</div><div id="compact-review"></div><p id="action-status" role="status" aria-live="polite"></p></section>
<div class="insight-tabs" role="tablist" aria-label="Policy insights"><button id="tab-flags" role="tab" aria-controls="panel-flags" aria-selected="true">Red flags</button><button id="tab-summary" role="tab" aria-controls="panel-summary" aria-selected="false" tabindex="-1">Summary</button><button id="tab-chat" role="tab" aria-controls="panel-chat" aria-selected="false" tabindex="-1">Chat</button></div>
<section id="panel-flags" role="tabpanel" aria-labelledby="tab-flags" tabindex="0"><div id="flags-content"></div></section>
<section id="panel-summary" role="tabpanel" aria-labelledby="tab-summary" tabindex="0" hidden><div id="summary-content"></div></section>
<section id="panel-chat" role="tabpanel" aria-labelledby="tab-chat" hidden><p id="chat-model" class="meta">Ask about this site’s policies</p><div id="chat-messages" aria-live="polite"></div><form id="chat-form"><label for="chat-input" class="sr-only">Ask about this site’s policies</label><textarea id="chat-input" maxlength="2000" rows="2" placeholder="Ask about this site…"></textarea><button id="chat-send" type="submit" aria-label="Send question">↑</button></form><p id="chat-status" role="status" aria-live="polite"></p></section>
<section class="sites-section" aria-labelledby="recent-heading"><h2 id="recent-heading">My sites</h2><div id="recent-items"></div><button id="open-summary" class="secondary">All sites ↗</button></section>
<details id="settings"><summary>Settings</summary><label><input id="review-enabled" type="checkbox"> Automatic checks</label><p id="ai-state" class="note"></p><button id="setup" class="secondary">Connection & consent</button></details>
</main><script type="module" src="popup.js"></script></body></html>
